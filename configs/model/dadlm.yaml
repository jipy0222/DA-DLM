family: dadlm
trained_context_length: ${data.sequence_length}
max_generation_length: null  # Total prompt + generated content; null uses trained_context_length.
block_size: 16  # Override with 4 or 8 for those block sizes.
dag_up_ratio: 4
grouped: true
transition_normalization: local
hidden_size: 768
cond_dim: 128
n_layers: 12
n_heads: 12
mlp_ratio: 4
rope_base: 10000.0
dropout: 0.1
attention_backend: flex
tie_word_embeddings: false
conditioning: zero_time_compat
timestep_embedding_size: 256
