# @package _global_
defaults:
  - override /data: lm1b
  - override /model: ar

runtime:
  local_batch_size: 64
  eval_batch_size: 64
  accumulate_grad_batches: 1
  devices: 8
  num_nodes: 1
  strategy: ddp
  max_steps: 500000
validation:
  every_updates: 10000
checkpoint:
  periodic_every_updates: 10000
startup:
  mode: fresh
  path: null
