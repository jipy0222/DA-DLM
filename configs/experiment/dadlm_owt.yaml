# @package _global_
defaults:
  - override /data: owt
  - override /model: dadlm

model:
  block_size: 16
runtime:
  local_batch_size: 12
  eval_batch_size: 12
  accumulate_grad_batches: 2
  devices: 8
  num_nodes: 3
  strategy: ddp
  max_steps: 53500
validation:
  every_updates: 4000
checkpoint:
  periodic_every_updates: 10000
startup:
  mode: initialize
  path: null
  source_kind: native
