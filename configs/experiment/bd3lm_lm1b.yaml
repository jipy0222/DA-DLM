# @package _global_
defaults:
  - override /data: lm1b
  - override /model: bd3lm

model:
  block_size: 16
runtime:
  local_batch_size: 64
  eval_batch_size: 64
  accumulate_grad_batches: 1
  devices: 8
  num_nodes: 1
  strategy: ddp
  max_steps: 150000
validation:
  every_updates: 10000
checkpoint:
  periodic_every_updates: 10000
startup:
  mode: initialize
  path: null
  source_kind: native
