# @package _global_
defaults:
  - summary_base
  - override /data: cnn
  - override /model: ar

runtime:
  local_batch_size: 32
  eval_batch_size: 32
  accumulate_grad_batches: 2
  devices: 8
  num_nodes: 1
  strategy: ddp
  max_steps: 3000
validation:
  every_updates: 225
checkpoint:
  periodic_every_updates: 500
logging:
  name: ar_cnn
