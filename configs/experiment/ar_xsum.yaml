# @package _global_
defaults:
  - summary_base
  - override /data: xsum
  - override /model: ar

runtime:
  local_batch_size: 32
  eval_batch_size: 32
  accumulate_grad_batches: 2
  devices: 8
  num_nodes: 1
  strategy: ddp
  max_steps: 6000
validation:
  every_updates: 125
checkpoint:
  periodic_every_updates: 1000
logging:
  name: ar_xsum
