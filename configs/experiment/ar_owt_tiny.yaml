# @package _global_
defaults:
  - override /data: owt_tiny
  - override /model: ar

runtime:
  local_batch_size: 32
  eval_batch_size: 32
  accumulate_grad_batches: 1
  devices: 8
  num_nodes: 1
  strategy: ddp
  max_steps: 10000
validation:
  every_updates: 400
checkpoint:
  periodic_every_updates: 2000
startup:
  mode: fresh
  path: null
